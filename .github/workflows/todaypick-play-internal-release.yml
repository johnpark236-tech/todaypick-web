name: TodayPick Play Internal Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Explicit Android versionCode (Required positive integer e.g. 73)'
        required: true
        type: string
      track:
        description: 'Google Play Track (Strictly locked to internal)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
      release_authorization:
        description: 'Explicit Release Authorization (Must be RELEASE_AUTHORIZED)'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'RELEASE_AUTHORIZED'

concurrency:
  group: todaypick-play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify & Release to Play Internal
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Release Gate Check
        run: |
          echo "=================================================="
          echo "TodayPick Play Release Gate Verification"
          echo "=================================================="
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "FATAL: Release workflow must ONLY be triggered via workflow_dispatch!"
            exit 1
          fi

          AUTH="${{ github.event.inputs.release_authorization }}"
          if [ "$AUTH" != "RELEASE_AUTHORIZED" ]; then
            echo "FATAL: Release not authorized. Got '$AUTH', expected 'RELEASE_AUTHORIZED'."
            exit 1
          fi

          TRACK="${{ github.event.inputs.track }}"
          if [ "$TRACK" != "internal" ]; then
            echo "FATAL: Target track '$TRACK' is forbidden. Only 'internal' is permitted."
            exit 1
          fi

          VC="${{ github.event.inputs.version_code }}"
          if ! [[ "$VC" =~ ^[0-9]+$ ]] || [ "$VC" -le 0 ]; then
            echo "FATAL: version_code must be a positive integer. Got: '$VC'"
            exit 1
          fi

          echo "RELEASE_AUTHORIZED=YES"
          echo "TARGET_TRACK=internal"
          echo "VERSION_CODE=$VC"
          echo "PRE_RELEASE_GATE=PASS"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Pipeline Timers
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies (npm ci)
        run: npm ci

      - name: Build Web Bundle (npm run build)
        run: |
          T0=$(date +%s)
          npm run build
          for f in The_Perfect_Fit.mp3 Ice_Cubes_in_the_Sun.mp3 Seven_AM_Sharp.mp3 Sunday_Hanger.mp3 Morning_Palette.mp3; do
            if [ ! -f "dist/audio/$f" ]; then
              echo "ERROR: required BGM audio missing in dist: $f"
              exit 1
            fi
          done
          echo "Verified 5 embedded BGM audio files in dist/audio"
          T1=$(date +%s)
          echo "NPM_BUILD_TIME=$((T1 - T0))" >> $GITHUB_ENV
          UI_VERSION=$(node -e "import('./src/config/version.js').then(m=>console.log(m.APP_DISPLAY_VERSION))")
          echo "APP_DISPLAY_VERSION=$UI_VERSION" >> $GITHUB_ENV

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          T0=$(date +%s)
          npx cap sync android
          T1=$(date +%s)
          echo "CAP_SYNC_TIME=$((T1 - T0))" >> $GITHUB_ENV

      - name: Decode Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/ci-release.keystore
            echo "KEYSTORE_EXISTS=true" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/ci-release.keystore" >> $GITHUB_ENV
            echo "Keystore decoded successfully."
          else
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi

      - name: Enforce Explicit versionCode
        run: |
          VC="${{ github.event.inputs.version_code }}"
          echo "BUILD_VERSION_CODE=$VC" >> $GITHUB_ENV
          echo "Enforced explicit release versionCode: $VC"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Release AAB
        working-directory: android
        env:
          BUILD_VERSION_CODE: ${{ env.BUILD_VERSION_CODE }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          T0=$(date +%s)
          echo "Building signed release bundle for versionCode: ${{ env.BUILD_VERSION_CODE }}"
          ./gradlew bundleRelease
          T1=$(date +%s)
          echo "GRADLE_BUILD_TIME=$((T1 - T0))" >> $GITHUB_ENV

      - name: Standardize and Measure AAB Artifact
        id: artifacts
        run: |
          VC="${{ env.BUILD_VERSION_CODE }}"
          AAB_DIR="android/app/build/outputs/bundle/release"
          AAB_FILE=$(find "$AAB_DIR" -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            NEW_AAB="$AAB_DIR/TodayPick-capacitor-1.0.0-vc$VC.aab"
            mv "$AAB_FILE" "$NEW_AAB"
            AAB_SIZE_BYTES=$(stat -c%s "$NEW_AAB")
            AAB_SIZE_MB=$(echo "scale=2; $AAB_SIZE_BYTES / 1048576" | bc)
            AAB_SHA=$(sha256sum "$NEW_AAB" | awk '{print $1}')
            echo "AAB_EXISTS=true" >> $GITHUB_ENV
            echo "AAB_NAME=TodayPick-capacitor-1.0.0-vc$VC.aab" >> $GITHUB_ENV
            echo "AAB_PATH=$NEW_AAB" >> $GITHUB_ENV
            echo "AAB_SIZE=$AAB_SIZE_MB MB" >> $GITHUB_ENV
            echo "AAB_SHA256=$AAB_SHA" >> $GITHUB_ENV
            echo "Verified release AAB artifact: $NEW_AAB ($AAB_SIZE_MB MB, SHA256: $AAB_SHA)"
          else
            echo "ERROR: AAB build output not found in $AAB_DIR"
            exit 1
          fi

          END_TIME=$(date +%s)
          TOTAL_SEC=$((END_TIME - START_TIME))
          echo "TOTAL_BUILD_TIME=$TOTAL_SEC" >> $GITHUB_ENV

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodayPick-Capacitor-Release-AAB-vc${{ env.BUILD_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Verify Google Play Credentials
        id: play_creds
        env:
          PLAY_SECRET: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SECRET" ]; then
            echo "CONFIGURED=true" >> $GITHUB_OUTPUT
            echo "Google Play service account secret is present."
          else
            echo "FATAL: PLAY_CONSOLE_SERVICE_ACCOUNT_JSON secret is not configured."
            exit 1
          fi

      - name: Verify AAB File Integrity for Play Release
        run: |
          if [ -z "${{ env.AAB_PATH }}" ] || [ ! -f "${{ env.AAB_PATH }}" ]; then
            echo "FATAL: AAB_PATH missing or invalid: ${{ env.AAB_PATH }}"
            exit 1
          fi
          echo "AAB file ready for upload: ${{ env.AAB_PATH }} ($(stat -c%s "${{ env.AAB_PATH }}") bytes)"

      - name: Upload to Google Play Console Internal Testing
        id: play_upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.todaypick.app
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
          status: completed

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f android/app/ci-release.keystore
          echo "Keystore cleaned up."

      - name: Generate Release Job Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 TodayPick Play Internal Release Summary

          | Property | Value |
          | :--- | :--- |
          | **Status** | ${{ job.status }} |
          | **Package ID** | `com.todaypick.app` |
          | **Target Track** | `internal` |
          | **versionCode** | `${{ env.BUILD_VERSION_CODE }}` |
          | **UI Version** | `${{ env.APP_DISPLAY_VERSION }}` |
          | **Trigger** | `${{ github.event_name }}` |
          | **Commit** | `${{ github.sha }}` |
          | **Run Number** | `${{ github.run_number }}` |
          | **AAB Artifact** | `${{ env.AAB_NAME || 'N/A' }}` (${{ env.AAB_SIZE || 'N/A' }}) |
          | **AAB SHA256** | `${{ env.AAB_SHA256 || 'N/A' }}` |
          | **Play Upload Result** | ${{ steps.play_upload.outcome == 'success' && '✅ Uploaded to Internal Track (PASS)' || '❌ FAILED' }} |
          EOF

      - name: Send Telegram Notification on Release Success
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram credentials not configured. Skipping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          CAPTION="🚀 TodayPick Google Play Internal Release SUCCESS!
          Package: com.todaypick.app
          Track: internal
          versionCode: ${{ env.BUILD_VERSION_CODE }}
          UI Version: ${{ env.APP_DISPLAY_VERSION }}
          Commit: ${SHORT_SHA}
          AAB: ${{ env.AAB_SIZE }}
          SHA256: ${{ env.AAB_SHA256 }}
          Build Time: ${{ env.TOTAL_BUILD_TIME }}s

          🔧 GitHub Actions Run:
          ${RUN_URL}"

          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${CAPTION}" || true

      - name: Send Telegram Notification on Release Failure
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram credentials not configured. Skipping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          MSG="❌ TodayPick Play Internal Release FAILED
          versionCode: ${{ env.BUILD_VERSION_CODE || github.event.inputs.version_code }}
          Track: internal
          Commit: ${SHORT_SHA}
          Run: #${{ github.run_number }}

          🔧 Actions Log:
          ${RUN_URL}"

          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" || true
