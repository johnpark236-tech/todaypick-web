name: TodayPick Publisher Static Tests
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/todaypick-chatgpt-drive-publish.yml'
      - 'automation/daily_looks/scripts/**'
      - 'publish_requests/**'
      - 'tests/test_chatgpt_publish_request.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile automation/daily_looks/scripts/publish_chatgpt_request_vm.py
          python -m unittest discover -s tests -p 'test_chatgpt_publish_request.py' -v
