name: TodayPick Single-First Register 260926 f30
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/todaypick-register-260926-f30.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: todaypick-register-260926-f30
  cancel-in-progress: false

jobs:
  enrich-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: todaypick-image-publish
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Apply reviewed metadata to published autumn f30 batch
        shell: bash
        run: |
          set -euo pipefail
          project="my-youtube-automation-497504"
          zone="us-central1-a"
          instance="Admin@tt-orchestra"
          cmd='set -euo pipefail; tmp=/tmp/todaypick-metadata-260926-f30-clean; rm -rf "$tmp"; git clone --depth 1 --branch master https://github.com/johnpark236-tech/todaypick-web.git "$tmp"; cd "$tmp"; /opt/todaypick-web/.venv/bin/python automation/daily_looks/scripts/apply_catalog_metadata.py --date 260926 --season autumn --segment female_30 --metadata automation/daily_looks/metadata/260926/autumn/f_30/metadata.json'
          gcloud compute ssh "$instance" --project="$project" --zone="$zone" --tunnel-through-iap --command="$cmd"

      - name: Report
        run: echo "TodayPick 260926 f_30 catalog metadata enrichment completed"
