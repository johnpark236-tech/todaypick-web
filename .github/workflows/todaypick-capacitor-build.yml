name: TodayPick Capacitor MVP Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web app
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK & AAB
        working-directory: android
        env:
          TODAYPICK_KEYSTORE_PASS: ${{ secrets.TODAYPICK_KEYSTORE_PASS }}
          TODAYPICK_KEYALIAS_PASS: ${{ secrets.TODAYPICK_KEYALIAS_PASS }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: todaypick-capacitor-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: todaypick-capacitor-aab
          path: android/app/build/outputs/bundle/release/*.aab
