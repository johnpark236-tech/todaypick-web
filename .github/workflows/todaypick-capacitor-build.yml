name: TodayPick Capacitor CI/CD Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target (all, apk, aab)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apk
          - aab
      version_code:
        description: 'Custom Android versionCode (Leave empty for auto: 22 + run_number)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - master
      - main
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'android/**'
      - '.github/workflows/**'

concurrency:
  group: todaypick-capacitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Pipeline Timers
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies (npm ci)
        run: npm ci

      - name: Build Web Bundle (npm run build)
        run: |
          T0=$(date +%s)
          npm run build
          T1=$(date +%s)
          echo "NPM_BUILD_TIME=$((T1 - T0))" >> $GITHUB_ENV

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          T0=$(date +%s)
          npx cap sync android
          T1=$(date +%s)
          echo "CAP_SYNC_TIME=$((T1 - T0))" >> $GITHUB_ENV

      - name: Decode Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/ci-release.keystore
            echo "KEYSTORE_EXISTS=true" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/ci-release.keystore" >> $GITHUB_ENV
            echo "Keystore decoded successfully."
          else
            echo "KEYSTORE_EXISTS=false" >> $GITHUB_ENV
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not set."
          fi

      - name: Determine versionCode
        run: |
          INPUT_VC="${{ github.event.inputs.version_code }}"
          RUN_NUM="${{ github.run_number }}"
          if [ -n "$INPUT_VC" ]; then
            VC="$INPUT_VC"
          else
            VC=$((22 + RUN_NUM))
          fi
          echo "BUILD_VERSION_CODE=$VC" >> $GITHUB_ENV
          echo "Using versionCode: $VC"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Packages (Release APK & AAB)
        working-directory: android
        env:
          BUILD_VERSION_CODE: ${{ env.BUILD_VERSION_CODE }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_TARGET: ${{ github.event.inputs.build_target || 'all' }}
        run: |
          T0=$(date +%s)
          TASKS=""
          if [ "$BUILD_TARGET" = "all" ] || [ "$BUILD_TARGET" = "apk" ]; then
            TASKS="$TASKS assembleRelease"
          fi
          if [ "$BUILD_TARGET" = "all" ] || [ "$BUILD_TARGET" = "aab" ]; then
            TASKS="$TASKS bundleRelease"
          fi
          echo "Running Gradle tasks: $TASKS"
          ./gradlew $TASKS
          T1=$(date +%s)
          echo "GRADLE_BUILD_TIME=$((T1 - T0))" >> $GITHUB_ENV

      - name: Standardize and Measure Artifacts
        id: artifacts
        run: |
          VC="${{ env.BUILD_VERSION_CODE }}"
          APK_DIR="android/app/build/outputs/apk/release"
          AAB_DIR="android/app/build/outputs/bundle/release"

          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            NEW_APK="$APK_DIR/TodayPick-capacitor-1.0.0-vc$VC.apk"
            mv "$APK_FILE" "$NEW_APK"
            APK_SIZE_BYTES=$(stat -c%s "$NEW_APK")
            APK_SIZE_MB=$(echo "scale=2; $APK_SIZE_BYTES / 1048576" | bc)
            APK_SHA=$(sha256sum "$NEW_APK" | awk '{print $1}')
            echo "APK_EXISTS=true" >> $GITHUB_ENV
            echo "APK_NAME=TodayPick-capacitor-1.0.0-vc$VC.apk" >> $GITHUB_ENV
            echo "APK_PATH=$NEW_APK" >> $GITHUB_ENV
            echo "APK_SIZE=$APK_SIZE_MB MB" >> $GITHUB_ENV
            echo "APK_SHA256=$APK_SHA" >> $GITHUB_ENV
          else
            echo "APK_EXISTS=false" >> $GITHUB_ENV
            echo "APK_SIZE=N/A" >> $GITHUB_ENV
            echo "APK_SHA256=N/A" >> $GITHUB_ENV
          fi

          AAB_FILE=$(find "$AAB_DIR" -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            NEW_AAB="$AAB_DIR/TodayPick-capacitor-1.0.0-vc$VC.aab"
            mv "$AAB_FILE" "$NEW_AAB"
            AAB_SIZE_BYTES=$(stat -c%s "$NEW_AAB")
            AAB_SIZE_MB=$(echo "scale=2; $AAB_SIZE_BYTES / 1048576" | bc)
            AAB_SHA=$(sha256sum "$NEW_AAB" | awk '{print $1}')
            echo "AAB_EXISTS=true" >> $GITHUB_ENV
            echo "AAB_NAME=TodayPick-capacitor-1.0.0-vc$VC.aab" >> $GITHUB_ENV
            echo "AAB_PATH=$NEW_AAB" >> $GITHUB_ENV
            echo "AAB_SIZE=$AAB_SIZE_MB MB" >> $GITHUB_ENV
            echo "AAB_SHA256=$AAB_SHA" >> $GITHUB_ENV
          else
            echo "AAB_EXISTS=false" >> $GITHUB_ENV
            echo "AAB_SIZE=N/A" >> $GITHUB_ENV
            echo "AAB_SHA256=N/A" >> $GITHUB_ENV
          fi

          END_TIME=$(date +%s)
          TOTAL_SEC=$((END_TIME - START_TIME))
          echo "TOTAL_BUILD_TIME=$TOTAL_SEC" >> $GITHUB_ENV

      - name: Upload Release APK Artifact
        if: env.APK_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TodayPick-Capacitor-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload Release AAB Artifact
        if: env.AAB_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TodayPick-Capacitor-AAB-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

      - name: Check Google Play Credentials
        id: play_creds
        env:
          PLAY_SECRET: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SECRET" ]; then
            echo "CONFIGURED=true" >> $GITHUB_OUTPUT
            echo "Google Play service account secret is configured."
          else
            echo "CONFIGURED=false" >> $GITHUB_OUTPUT
            echo "Notice: PLAY_CONSOLE_SERVICE_ACCOUNT_JSON secret not set. Skipping Google Play upload."
          fi

      - name: Verify AAB File for Google Play
        if: success() && env.AAB_EXISTS == 'true' && steps.play_creds.outputs.CONFIGURED == 'true'
        run: |
          if [ -z "${{ env.AAB_PATH }}" ] || [ ! -f "${{ env.AAB_PATH }}" ]; then
            echo "ERROR: AAB_PATH missing or file does not exist: ${{ env.AAB_PATH }}"
            exit 1
          fi
          echo "AAB file verified: ${{ env.AAB_PATH }} ($(stat -c%s "${{ env.AAB_PATH }}") bytes)"

      - name: Upload to Google Play Console Internal Testing (third-party r0adkll/upload-google-play@v1)
        if: success() && env.AAB_EXISTS == 'true' && steps.play_creds.outputs.CONFIGURED == 'true'
        id: play_upload
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.todaypick.app
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
          status: completed
          changesNotSentForReview: true

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f android/app/ci-release.keystore
          echo "Keystore cleaned up."

      - name: Generate GitHub Job Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 TodayPick Capacitor Build Summary

          | Property | Value |
          | :--- | :--- |
          | **Status** | ${{ job.status }} |
          | **Package ID** | `com.todaypick.app` |
          | **Branch** | `${{ github.ref_name }}` |
          | **Commit** | `${{ github.sha }}` |
          | **Run Number** | `${{ github.run_number }}` |
          | **versionCode** | `${{ env.BUILD_VERSION_CODE }}` |
          | **Vite Build Time** | `${{ env.NPM_BUILD_TIME }}s` |
          | **Cap Sync Time** | `${{ env.CAP_SYNC_TIME }}s` |
          | **Gradle Build Time** | `${{ env.GRADLE_BUILD_TIME }}s` |
          | **Total Pipeline Time** | `${{ env.TOTAL_BUILD_TIME }}s` |
          | **APK Artifact** | `${{ env.APK_NAME || 'N/A' }}` (${{ env.APK_SIZE || 'N/A' }}) |
          | **APK SHA256** | `${{ env.APK_SHA256 || 'N/A' }}` |
          | **AAB Artifact** | `${{ env.AAB_NAME || 'N/A' }}` (${{ env.AAB_SIZE || 'N/A' }}) |
          | **AAB SHA256** | `${{ env.AAB_SHA256 || 'N/A' }}` |
          | **Google Play Internal** | ${{ steps.play_creds.outputs.CONFIGURED == 'true' && (steps.play_upload.outcome == 'success' && '✅ Uploaded to Internal Track (PASS)' || '❌ GOOGLE_PLAY_UPLOAD=FAIL (See Logs)') || '⏸️ NOT_TESTED_SECRET_PENDING' }} |
          EOF

      - name: Send APK Directly to Telegram on Success
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram credentials not configured. Skipping."
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ steps.play_creds.outputs.CONFIGURED }}" = "true" ]; then
            if [ "${{ steps.play_upload.outcome }}" = "success" ]; then
              PLAY_STATUS="GOOGLE_PLAY_UPLOAD=PASS"
            else
              PLAY_STATUS="GOOGLE_PLAY_UPLOAD=FAIL"
            fi
          else
            PLAY_STATUS="GOOGLE_PLAY_UPLOAD=NOT_TESTED_SECRET_PENDING"
          fi
          CAPTION="✅ TodayPick Build PASS
          Branch: ${{ github.ref_name }}
          Commit: ${SHORT_SHA}
          Run: #${{ github.run_number }}
          versionCode: ${{ env.BUILD_VERSION_CODE }}
          APK: ${{ env.APK_SIZE }}
          AAB: ${{ env.AAB_SIZE }}
          Google Play: ${PLAY_STATUS}
          Build: ${{ env.TOTAL_BUILD_TIME }}초

          🔧 GitHub Actions 로그:
          ${RUN_URL}"

          if [ "${{ env.APK_EXISTS }}" = "true" ] && [ -f "${{ env.APK_PATH }}" ]; then
            RESPONSE=$(curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F "chat_id=${TG_CHAT}" \
              -F "document=@${{ env.APK_PATH }}" \
              -F "caption=${CAPTION}")
          else
            RESPONSE=$(curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${CAPTION}")
          fi

          echo "$RESPONSE" | jq -e '.ok == true' > /dev/null
          MESSAGE_ID=$(echo "$RESPONSE" | jq -r '.result.message_id // empty')
          echo "Telegram API ok=true. message_id=${MESSAGE_ID}"

      - name: Send Telegram Notification on Failure
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram credentials not configured. Skipping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          MSG="❌ TodayPick Capacitor Build FAILED

          Branch: ${{ github.ref_name }}
          Commit: ${SHORT_SHA}
          Run: #${{ github.run_number }}

          🔧 Actions 로그 확인:
          ${RUN_URL}"

          RESPONSE=$(curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}")
          echo "$RESPONSE" | jq -e '.ok == true' > /dev/null
          MESSAGE_ID=$(echo "$RESPONSE" | jq -r '.result.message_id // empty')
          echo "Telegram failure API ok=true. message_id=${MESSAGE_ID}"
